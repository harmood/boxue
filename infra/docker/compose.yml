name: boxue

services:
  postgres:
    image: postgres:17-alpine
    container_name: boxue-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boxue}
      POSTGRES_USER: ${POSTGRES_USER:-boxue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boxue_dev_pwd}
    ports:
      # 宿主机统一 5433，与 dev-env 原生实例保持一致
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - boxue-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: boxue-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - boxue-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 本机与 Docker 统一使用 S3 兼容存储 RustFS
  object-storage:
    image: rustfs/rustfs:latest
    container_name: boxue-object-storage
    command: server --address :9000 --console-address :9001 --console-enable
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-boxue_dev}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-boxue_dev_secret_change_me}
      RUSTFS_VOLUMES: /data
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - boxue-s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: boxue-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  boxue-postgres-data:
  boxue-redis-data:
  boxue-s3-data:
