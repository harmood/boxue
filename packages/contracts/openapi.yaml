openapi: 3.1.0
info:
  title: 博学 API
  version: 0.2.0
  license:
    name: Proprietary
    identifier: UNLICENSED
  description: |
    博学多端学习平台 API 契约。
    完整设计见 packages/contracts/API-CONTRACT.md。
servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发
tags:
  - name: Health
    description: 服务健康检查
  - name: Auth
    description: 注册、登录、令牌与设备会话
  - name: User
    description: 当前用户资料、设置与设备
  - name: Admin
    description: 管理后台认证、用户、角色、监控与审计
  - name: Banks
    description: 题库创建、查询、更新与删除
  - name: Questions
    description: 题目、版本、标签与知识点
  - name: Media
    description: 图片上传、元数据与引用
  - name: Imports
    description: 导入与导出任务
  - name: Practice
    description: 练习会话、作答与结果
  - name: Review
    description: 错题复习与掌握度
  - name: Sync
    description: 多端增量同步与冲突处理
  - name: AI
    description: AI 预留接口，第一阶段默认关闭
paths:
  /health:
    get:
      tags: [Health]
      summary: 服务健康检查
      operationId: health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /auth/register:
    post:
      tags: [Auth]
      summary: 注册账号
      operationId: register
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XClientPlatform"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: 验证邮箱
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: 验证成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyEmailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: 重新发送验证邮件
      operationId: resendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: 已接受
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      operationId: login
      security: []
      parameters:
        - $ref: "#/components/parameters/XClientPlatform"
        - $ref: "#/components/parameters/XAppVersion"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              description: Web 端的 Refresh Token Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新 Access Token
      operationId: refreshToken
      security: []
      parameters:
        - $ref: "#/components/parameters/XClientPlatform"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出当前会话
      operationId: logout
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XDeviceId"
      responses:
        "204":
          description: 已退出
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: 退出所有设备
      operationId: logoutAll
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 已退出所有会话
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: 请求重置密码
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: 已接受
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: 使用令牌重置密码
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: 重置成功
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /me:
    get:
      tags: [User]
      summary: 获取当前用户
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XDeviceId"
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [User]
      summary: 修改个人资料
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XDeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /me/change-password:
    post:
      tags: [User]
      summary: 修改密码
      operationId: changePassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XDeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 修改成功
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /devices:
    get:
      tags: [User]
      summary: 获取当前用户设备列表
      operationId: listDevices
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XDeviceId"
      responses:
        "200":
          description: 设备列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /devices/{deviceId}:
    delete:
      tags: [User]
      summary: 移除设备
      operationId: removeDevice
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceIdPath"
      responses:
        "204":
          description: 已移除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/auth/login:
    post:
      tags: [Admin]
      summary: 管理员登录
      operationId: adminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /admin/auth/refresh:
    post:
      tags: [Admin]
      summary: 管理员刷新 Token
      operationId: adminRefreshToken
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/auth/logout:
    post:
      tags: [Admin]
      summary: 管理员退出
      operationId: adminLogout
      security:
        - adminBearerAuth: []
      responses:
        "204":
          description: 已退出
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/auth/logout-all:
    post:
      tags: [Admin]
      summary: 管理员退出所有设备
      operationId: adminLogoutAll
      security:
        - adminBearerAuth: []
      responses:
        "204":
          description: 已退出所有会话
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/auth/me:
    get:
      tags: [Admin]
      summary: 获取当前管理员
      operationId: adminMe
      security:
        - adminBearerAuth: []
      responses:
        "200":
          description: 当前管理员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users:
    get:
      tags: [Admin]
      summary: 查询用户列表
      operationId: adminListUsers
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminUserQuery"
        - $ref: "#/components/parameters/AdminUserStatus"
        - $ref: "#/components/parameters/AdminUserRole"
        - $ref: "#/components/parameters/CreatedFrom"
        - $ref: "#/components/parameters/CreatedTo"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 用户分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{userId}:
    get:
      tags: [Admin]
      summary: 查询用户详情
      operationId: adminGetUser
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: 用户详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Admin]
      summary: 修改用户状态
      operationId: adminUpdateUserStatus
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
      responses:
        "200":
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/users/{userId}/roles:
    put:
      tags: [Admin]
      summary: 替换用户角色
      operationId: adminSetUserRoles
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserRolesRequest"
      responses:
        "200":
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/users/{userId}/password-reset:
    post:
      tags: [Admin]
      summary: 触发用户密码重置
      operationId: adminTriggerPasswordReset
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "202":
          description: 已接受
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /admin/users/{userId}/force-logout:
    post:
      tags: [Admin]
      summary: 强制用户下线
      operationId: adminForceLogout
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "204":
          description: 已强制下线
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/roles:
    get:
      tags: [Admin]
      summary: 查询角色列表
      operationId: adminListRoles
      security:
        - adminBearerAuth: []
      responses:
        "200":
          description: 角色列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin]
      summary: 创建角色
      operationId: adminCreateRole
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/roles/{roleId}:
    put:
      tags: [Admin]
      summary: 更新角色
      operationId: adminUpdateRole
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Admin]
      summary: 删除角色
      operationId: adminDeleteRole
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleIdPath"
      responses:
        "204":
          description: 删除成功
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/permissions:
    get:
      tags: [Admin]
      summary: 查询权限列表
      operationId: adminListPermissions
      security:
        - adminBearerAuth: []
      responses:
        "200":
          description: 权限列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: 查询审计日志
      operationId: adminListAuditLogs
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuditActorId"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditTargetType"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 审计日志分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /banks:
    get:
      tags: [Banks]
      summary: 查询当前用户题库
      operationId: listBanks
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, ARCHIVED]
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 题库分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Banks]
      summary: 创建题库
      operationId: createBank
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBankRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /banks/{bankId}:
    get:
      tags: [Banks]
      summary: 获取题库详情
      operationId: getBank
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BankIdPath"
      responses:
        "200":
          description: 题库
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Banks]
      summary: 更新题库
      operationId: updateBank
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BankIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBankRequest"
      responses:
        "200":
          description: 更新后的题库
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Banks]
      summary: 删除题库
      operationId: deleteBank
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BankIdPath"
        - name: cascade
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: 删除成功
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/banks:
    get:
      tags: [Admin]
      summary: 管理员查询题库
      operationId: adminListBanks
      security:
        - adminBearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: ownerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, ARCHIVED]
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum: [PRIVATE, UNLISTED, PUBLIC]
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 题库分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBankPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/banks/{bankId}:
    get:
      tags: [Admin]
      summary: 管理员查询题库详情
      operationId: adminGetBank
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BankIdPath"
      responses:
        "200":
          description: 题库详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBankView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 普通用户 Access Token，audience=client
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 管理员 Access Token，audience=admin

  parameters:
    XDeviceId:
      name: X-Device-Id
      in: header
      required: false
      description: 客户端设备 ID
      schema:
        type: string
        format: uuid
    XClientPlatform:
      name: X-Client-Platform
      in: header
      required: false
      description: 客户端平台
      schema:
        $ref: "#/components/schemas/ClientPlatform"
    XAppVersion:
      name: X-App-Version
      in: header
      required: false
      description: 客户端版本
      schema:
        type: string
        maxLength: 50
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 客户端请求追踪 ID
      schema:
        type: string
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 创建类请求幂等键
      schema:
        type: string
        maxLength: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: 服务端生成的分页游标，客户端不得解析
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: 每页数量
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DeviceIdPath:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleIdPath:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminUserQuery:
      name: q
      in: query
      required: false
      description: 邮箱/用户名/昵称模糊搜索
      schema:
        type: string
        maxLength: 200
    AdminUserStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/UserStatus"
    AdminUserRole:
      name: role
      in: query
      required: false
      description: 角色码
      schema:
        type: string
        maxLength: 64
    CreatedFrom:
      name: createdFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time
    CreatedTo:
      name: createdTo
      in: query
      required: false
      schema:
        type: string
        format: date-time
    AuditActorId:
      name: actorId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    AuditAction:
      name: action
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    AuditTargetType:
      name: targetType
      in: query
      required: false
      schema:
        type: string
        maxLength: 50
    AuditFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time

    BankIdPath:
      name: bankId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: 未认证或令牌无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: 版本冲突或资源重复
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Locked:
      description: 账号锁定
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnprocessableEntity:
      description: 业务校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: 限流
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: 服务端错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    BankVisibility:
      type: string
      enum: [PRIVATE, UNLISTED, PUBLIC]

    BankStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]

    BankView:
      type: object
      required: [id, name, visibility, status, questionCount, practicedCount, accuracy, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        visibility:
          $ref: "#/components/schemas/BankVisibility"
        status:
          $ref: "#/components/schemas/BankStatus"
        questionCount:
          type: integer
          minimum: 0
        practicedCount:
          type: integer
          minimum: 0
        accuracy:
          type: number
          minimum: 0
          maximum: 1
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BankPage:
      type: object
      required: [items, hasMore]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BankView"
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean

    CreateBankRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        visibility:
          $ref: "#/components/schemas/BankVisibility"

    UpdateBankRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        status:
          $ref: "#/components/schemas/BankStatus"
        version:
          type: integer
          minimum: 1

    AdminBankView:
      type: object
      required: [id, ownerId, ownerEmail, name, visibility, status, questionCount, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        ownerEmail:
          type: string
          format: email
        name:
          type: string
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        visibility:
          $ref: "#/components/schemas/BankVisibility"
        status:
          $ref: "#/components/schemas/BankStatus"
        questionCount:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminBankPage:
      type: object
      required: [items, hasMore]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminBankView"
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean

    UserStatus:
      type: string
      enum: [PENDING_VERIFICATION, ACTIVE, DISABLED, LOCKED, DELETED]
    ClientPlatform:
      type: string
      enum: [web, desktop, android, admin]
    DevicePlatform:
      type: string
      enum: [WEB, DESKTOP, ANDROID, ADMIN]

    ApiError:
      type: object
      required: [code, message, traceId, timestamp]
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 100
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time

    MessageResponse:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string

    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
