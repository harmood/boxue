spring:
  application:
    name: boxue-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/boxue}
    username: ${SPRING_DATASOURCE_USERNAME:boxue}
    password: ${SPRING_DATASOURCE_PASSWORD:boxue_dev_pwd}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

boxue:
  security:
    jwt:
      issuer: ${JWT_ISSUER:boxue}
      client-secret: ${JWT_CLIENT_SECRET:dev-client-secret-change-me-32-bytes}
      admin-secret: ${JWT_ADMIN_SECRET:dev-admin-secret-change-me-32-bytes}
      access-token-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  auth:
    require-email-verification: ${BOXUE_AUTH_REQUIRE_EMAIL_VERIFICATION:false}
    max-failed-logins: 5
    lockout-minutes: 15
  ai:
    enabled: false
  sync:
    max-batch-size: 500
    retention-days: 90
